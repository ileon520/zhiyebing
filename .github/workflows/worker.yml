name: 云端后台自动挂机打工人

on:
  schedule:
    # ⏰ 每 5 分钟自动云端巡逻一次
    - cron: '*/5 * * * *'
  workflow_dispatch: # 👈 同时也支持姐姐在 GitHub 网页上手动点击立即运行

jobs:
  cloud-worker:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库最新代码
        uses: actions/checkout@v3

      - name: 2. 配置 Python 运行环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 自动安装所需的 Python 依赖库
        run: |
          pip install -r requirements.txt

      - name: 4. 运行后台 Worker 处理挂机任务
        run: |
          python worker.py
